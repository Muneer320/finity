services:
  backend:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: sqlite:///./data/finity.db
      SECRET_KEY: ${SECRET_KEY:-local-demo-key-change-for-long-lived-use}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - finity_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  finity_data:
